<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Style Picker — เลือกลุคก่อนทำโปรเจค</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0e14;--card:#171923;--card2:#1d2030;--line:#2a2d3d;--text:#f2f3f7;--sub:#9aa0b5;--acc:#7c6cff;--ok:#4ade80}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Sarabun',sans-serif}
  header{position:sticky;top:0;z-index:50;background:rgba(13,14,20,0.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:1.15rem;font-weight:700;letter-spacing:-0.3px}
  header h1 span{background:linear-gradient(90deg,#7c6cff,#4fc3f7,#ff6ec7);-webkit-background-clip:text;background-clip:text;color:transparent}
  .h-actions{display:flex;gap:8px;align-items:center}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:10px;font-size:0.85rem;font-family:'Sarabun';cursor:pointer;transition:.2s;font-weight:500}
  .btn:hover{border-color:var(--acc);transform:translateY(-1px)}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  .btn.primary:hover{filter:brightness(1.15)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .wrap{max-width:1200px;margin:0 auto;padding:20px}
  .cats{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;padding-bottom:6px}
  .cat-btn{background:var(--card);border:1px solid var(--line);color:var(--sub);padding:7px 16px;border-radius:99px;font-size:0.82rem;cursor:pointer;white-space:nowrap;transition:.2s;font-family:'Sarabun'}
  .cat-btn:hover{color:var(--text)}
  .cat-btn.on{background:rgba(124,108,255,0.15);border-color:var(--acc);color:#c9c0ff;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:.25s;display:flex;flex-direction:column;position:relative}
  .item:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 10px 30px rgba(124,108,255,0.12)}
  .item.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc),0 10px 30px rgba(124,108,255,0.2)}
  .item .chk{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;display:none;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700}
  .item.sel .chk{display:flex}
  .item .meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .item h3{font-size:0.98rem;font-weight:600}
  .tag{font-size:0.68rem;padding:2px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
  .tag.heart{background:rgba(255,110,199,0.2);color:#ff8fd0}
  .tag.dev{background:rgba(79,195,247,0.18);color:#7fd4f8}
  .tag.fun{background:rgba(255,200,87,0.18);color:#ffd166}
  .tag.brand{background:rgba(74,222,128,0.15);color:#86efac}
  .item .feel{font-size:0.78rem;color:var(--sub);margin-bottom:10px;line-height:1.45}
  .phone{width:100%;aspect-ratio:9/15;border-radius:18px;overflow:hidden;position:relative;display:block;box-shadow:0 8px 24px rgba(0,0,0,0.4);margin-top:auto}
  .phone .ph{display:flex;flex-direction:column;height:100%;padding:12px 10px 8px}
  .p-top{display:flex;justify-content:space-between;align-items:center;font-size:0.55rem;opacity:.8;margin-bottom:8px}
  .p-greet{font-size:0.58rem;opacity:.65}
  .p-name{font-size:0.8rem;font-weight:600;margin-bottom:6px}
  .p-bal{font-size:1.25rem;font-weight:700;letter-spacing:-0.5px;margin-bottom:10px}
  .p-btns{display:flex;gap:5px;margin-bottom:8px}
  .p-btn{flex:1;text-align:center;font-size:0.58rem;padding:5px 0;border-radius:8px;font-weight:600}
  .p-list{display:flex;flex-direction:column;gap:4px}
  .p-row{display:flex;justify-content:space-between;align-items:center;padding:5px 7px;border-radius:7px;font-size:0.56rem}
  .p-row .l{display:flex;align-items:center;gap:5px}
  .p-row .ic{width:14px;height:14px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:0.5rem}
  .p-row .amt{font-weight:600}
  .p-nav{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:6px 0;font-size:0.5rem}
  .p-nav span{opacity:.6}
  .p-nav span.on{font-weight:700;opacity:1}
  /* ===== detail panel ===== */
  .panel{position:fixed;top:0;right:-560px;width:min(560px,94vw);height:100vh;background:var(--card);border-left:1px solid var(--line);z-index:100;transition:right .3s ease;overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,0.5)}
  .panel.open{right:0}
  .panel .phd{position:sticky;top:0;background:rgba(23,25,35,0.95);backdrop-filter:blur(10px);padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .panel .phd h2{font-size:1.1rem}
  .panel .phd .close{background:none;border:none;color:var(--sub);font-size:1.4rem;cursor:pointer;padding:4px 8px}
  .panel .pbody{padding:20px}
  .panel .big-phone{width:200px;margin:0 auto 18px}
  .panel .feel{color:var(--sub);font-size:0.9rem;margin-bottom:14px;line-height:1.6}
  .tokens{display:flex;flex-direction:column;gap:8px;margin:14px 0}
  .tok{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:0.8rem}
  .tok .k{color:var(--sub)}
  .tok .v{display:flex;align-items:center;gap:8px;font-family:monospace;font-size:0.75rem}
  .swatch{width:18px;height:18px;border-radius:5px;border:1px solid rgba(255,255,255,0.15)}
  .sw-row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .sw-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:0.62rem;color:var(--sub)}
  .sw-item .sw{width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,0.15)}
  .export-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .export-actions .btn{flex:1;min-width:130px}
  /* ===== editor ปรับแต่ง ===== */
  .edit-sec{margin-top:6px}
  .edit-sec .sec-title{font-size:0.85rem;color:var(--sub);margin:14px 0 8px;display:flex;align-items:center;gap:6px}
  .edit-item{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;margin-bottom:6px;flex-wrap:wrap}
  .edit-item .el{width:104px;font-size:0.76rem;color:var(--sub);flex-shrink:0}
  .edit-item input[type=color]{width:30px;height:30px;border:none;background:none;cursor:pointer;padding:0;border-radius:6px;flex-shrink:0}
  .edit-item .bg-pts{display:flex;gap:4px;flex-wrap:wrap}
  .edit-item input.txt{flex:1;min-width:110px;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;font-family:monospace;font-size:0.68rem}
  .edit-item input.txt:focus{outline:none;border-color:var(--acc)}
  .edit-extra{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .edit-extra label{font-size:0.76rem;color:var(--sub);display:flex;align-items:center;gap:6px}
  .edit-extra input[type=range]{width:100px;accent-color:var(--acc)}
  .edit-extra select{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 8px;font-size:0.72rem}
  .edit-actions{display:flex;gap:8px;margin-top:10px}
  .edit-actions .btn{flex:1}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ok);color:#052e16;padding:12px 22px;border-radius:12px;font-weight:600;font-size:0.9rem;z-index:200;opacity:0;transition:.3s;box-shadow:0 8px 30px rgba(0,0,0,0.4)}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .empty{text-align:center;color:var(--sub);padding:60px 0;font-size:0.9rem}
  .foot-note{text-align:center;color:var(--sub);font-size:0.75rem;margin-top:30px;line-height:1.7}
</style>
</head>
<body>

<header>
  <h1>UI Style Picker <span>✦ เลือกลุคก่อนทำ</span></h1>
  <div class="h-actions">
    <button class="btn" id="btnExport" disabled>⬇ Export CSS tokens</button>
  </div>
</header>

<div class="wrap">
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">ไม่พบลุคในหมวดนี้</div>
  <p class="foot-note">
    คลิกการ์ดเพื่อดูรายละเอียด + Export · ทุกตัวอย่างใช้ข้อมูลเดียวกัน (฿24,850.75) เพื่อเทียบกันง่าย<br>
    สี/ฟอนต์/มุม/เงา → ได้เป็น CSS variables ไปใช้ในโปรเจคต่อได้ทันที ✨
  </p>
</div>

<!-- detail panel -->
<div class="panel" id="panel">
  <div class="phd">
    <h2 id="pTitle">ลุค</h2>
    <button class="close" id="pClose">✕</button>
  </div>
  <div class="pbody">
    <div class="big-phone" id="pPhone"></div>
    <p class="feel" id="pFeel"></p>
    <h3 style="font-size:0.85rem;color:var(--sub);margin-bottom:4px">ชุดสี</h3>
    <div class="sw-row" id="pSwatches"></div>
    <h3 style="font-size:0.85rem;color:var(--sub);margin-bottom:4px">Design tokens</h3>
    <div class="tokens" id="pTokens"></div>

    <div class="edit-sec">
      <div class="sec-title">🎨 ปรับแต่งก่อนดาวน์โหลด</div>
      <div id="pEdit"></div>
      <div class="edit-extra">
        <label>มุมโค้ง <input type="range" id="rRadius" min="0" max="32" value="12"> <span id="rRadiusVal">12</span>px</label>
        <label>ฟอนต์
          <select id="fFont">
            <option value="'Sarabun',sans-serif">Sarabun</option>
            <option value="'Inter','Sarabun',sans-serif">Inter</option>
            <option value="'Source Sans 3','Sarabun',sans-serif">Source Sans 3</option>
            <option value="'Space Grotesk','Sarabun',sans-serif">Space Grotesk</option>
            <option value="Georgia,'Sarabun',serif">Georgia (serif)</option>
            <option value="'Courier New',monospace">Courier (mono)</option>
            <option value="system-ui,'Sarabun',sans-serif">System UI</option>
          </select>
        </label>
      </div>
      <div class="edit-actions">
        <button class="btn" id="pReset">↺ รีเซ็ตเป็นค่าเดิม</button>
      </div>
    </div>

    <div class="export-actions">
      <button class="btn primary" id="pExportCss">⬇ Download .css</button>
      <button class="btn" id="pCopyCss">📋 Copy CSS</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

/* ---------- render phone mockup จาก tokens ---------- */
const ICONS = ['🛒','💼','☕'];
const NAMES = ['เซเว่น','เงินเดือน','คาเฟ่'];
const AMTS  = ['-฿89','+฿25,000','-฿120'];

function phoneHTML(s){
  const t=s.t;
  return `<div class="phone" style="background:${t.bg}">
    <div class="ph" style="background:${t.surface};backdrop-filter:${t.bg.includes('gradient')?'blur(14px)':'none'};border:${t.border};border-radius:18px">
      <div class="p-top" style="color:${t.text};opacity:.75"><span>09:41</span><span>📶 🔋</span></div>
      <div class="p-greet" style="color:${t.text}">สวัสดี, พี่เต้ย</div>
      <div class="p-name" style="color:${t.text}">ยอดเงินคงเหลือ</div>
      <div class="p-bal" style="color:${t.text};font-family:${t.font}">฿24,850.75</div>
      <div class="p-btns">
        <div class="p-btn" style="background:${t.btn};color:${t.btnTxt};border-radius:${t.radius}">+ โอนเข้า</div>
        <div class="p-btn" style="background:${t.btn};color:${t.btnTxt};border-radius:${t.radius}">โอนออก</div>
      </div>
      <div class="p-list">
        ${[0,1,2].map(i=>`<div class="p-row" style="background:${t.row};color:${t.rowTxt};border-radius:${t.radius};box-shadow:${t.shadow}">
          <span class="l"><span class="ic" style="background:${t.icBg}">${ICONS[i]}</span> ${NAMES[i]}</span>
          <span class="amt" style="opacity:${i===1?1:.85}">${AMTS[i]}</span>
        </div>`).join('')}
      </div>
      <div class="p-nav" style="color:${t.nav}"><span class="on" style="color:${t.accent}">บ้าน</span><span>สถิติ</span><span>บัญชี</span><span>ตั้งค่า</span></div>
    </div>
  </div>`;
}

/* ---------- state ---------- */
let selCat = 'ทั้งหมด';
let selected = null;

/* ---------- render grid ---------- */
function cats(){
  const c = ['ทั้งหมด', ...new Set(STYLES.map(s=>s.cat))];
  document.getElementById('cats').innerHTML = c.map(x=>`<button class="cat-btn ${x===selCat?'on':''}" data-cat="${x}">${x}</button>`).join('');
  document.querySelectorAll('.cat-btn').forEach(b=>b.addEventListener('click',()=>{selCat=b.dataset.cat;render();}));
}
function render(){
  cats();
  const list = selCat==='ทั้งหมด'?STYLES:STYLES.filter(s=>s.cat===selCat);
  const g = document.getElementById('grid');
  g.innerHTML = list.map(s=>`
    <div class="item ${selected&&selected.id===s.id?'sel':''}" data-id="${s.id}">
      <div class="chk">✓</div>
      <div class="meta"><h3>${s.name}</h3><span class="tag ${s.tag}">${s.tagTxt}</span></div>
      <p class="feel">${s.feel}</p>
      ${phoneHTML(s)}
    </div>`).join('');
  g.querySelectorAll('.item').forEach(el=>el.addEventListener('click',()=>select(el.dataset.id)));
}

/* ---------- select + panel ---------- */
function select(id){
  selected = STYLES.find(s=>s.id===id);
  render();
  document.getElementById('btnExport').disabled = false;
  openPanel(selected);
}
function openPanel(s){
  document.getElementById('pTitle').textContent = s.name;
  document.getElementById('pFeel').textContent = s.feel + ' — ' + s.use;
  refreshPanel(s);
  window.__origT = JSON.stringify(s.t);
  buildEditor(s);
  const rv = parseInt(s.t.radius)||12;
  document.getElementById('rRadius').value = Math.min(Math.max(rv,0),32);
  document.getElementById('rRadiusVal').textContent = rv;
  document.getElementById('fFont').value = s.t.font;
  document.getElementById('panel').classList.add('open');
}
function refreshPanel(s){
  s = s || selected;
  document.getElementById('pPhone').innerHTML = phoneHTML(s);
  document.getElementById('pSwatches').innerHTML = s.colors.map(c=>`<div class="sw-item"><div class="sw" style="background:${c}"></div><span>${c}</span></div>`).join('');
  const t=s.t;
  const rows=[['พื้นหลัง',t.bg],['พื้นผิว',t.surface],['ตัวอักษร',t.text],['สีหลัก/ปุ่ม',t.accent],['มุมโค้ง',t.radius],['ฟอนต์',t.font],['เงา',t.shadow],['เส้นขอบ',t.border]];
  document.getElementById('pTokens').innerHTML = rows.map(r=>`<div class="tok"><span class="k">${r[0]}</span><span class="v"><span class="swatch" style="background:${r[1]}"></span>${r[1]}</span></div>`).join('');
}
function closePanel(){document.getElementById('panel').classList.remove('open');}
document.getElementById('pClose').addEventListener('click',closePanel);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});

/* ---------- editor: ปรับแต่งสี/ฟอนต์/มุมก่อนดาวน์โหลด ---------- */
const EDIT_FIELDS = [
  ['accent','สีหลัก / ปุ่ม'],
  ['text','ตัวอักษร'],
  ['surface','พื้นผิว'],
  ['bg','พื้นหลัง'],
  ['btn','สีปุ่ม'],
  ['btnTxt','ข้อความปุ่ม'],
  ['row','แถวรายการ'],
  ['rowTxt','ข้อความแถว'],
  ['nav','แถบล่าง'],
  ['icBg','ไอคอน'],
];
function buildEditor(s){
  const t=s.t;
  const el=document.getElementById('pEdit');
  let html='';
  for(const [k,label] of EDIT_FIELDS){
    const val=t[k];
    // พื้นหลังพิเศษ: แยกจุดสี gradient → หลาย color picker
    if(k==='bg' && /^linear-gradient/.test(val)){
      const pts = val.split(',').slice(1).map(p=>p.trim().split(/\s+/)[0]); // สีของแต่ละ stop
      html += `<div class="edit-item"><span class="el">${label}</span><div class="bg-pts">` +
        pts.map((c,i)=>`<input type="color" data-bgpt="${i}" value="${c}">`).join('') +
        `</div><input type="text" class="txt" data-field="bg" value="${val}"></div>`;
    } else {
      const isHex = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(val);
      html += `<div class="edit-item"><span class="el">${label}</span>` +
        (isHex ? `<input type="color" data-field="${k}" value="${val}">` : '') +
        `<input type="text" class="txt" data-field="${k}" value="${val}"></div>`;
    }
  }
  el.innerHTML = html;
  // ผูก events
  el.querySelectorAll('input[type=color][data-field]').forEach(inp=>{
    inp.addEventListener('input',()=>{ selected.t[inp.dataset.field] = inp.value; syncTxt(inp.dataset.field); refreshPanel(); });
  });
  el.querySelectorAll('input[type=color][data-bgpt]').forEach(inp=>{
    inp.addEventListener('input',()=>{ applyBgPoint(parseInt(inp.dataset.bgpt), inp.value); });
  });
  el.querySelectorAll('input.txt').forEach(inp=>{
    inp.addEventListener('input',()=>{ selected.t[inp.dataset.field] = inp.value; syncPicker(inp.dataset.field); refreshPanel(); });
  });
}
function syncTxt(k){ const t=document.querySelector(`#pEdit input.txt[data-field="${k}"]`); if(t && t.value!==selected.t[k]) t.value=selected.t[k]; }
function syncPicker(k){ const p=document.querySelector(`#pEdit input[type=color][data-field="${k}"]`); if(p && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(selected.t[k])) p.value=selected.t[k]; }
function applyBgPoint(idx, color){
  const t=selected.t;
  if(!/^linear-gradient/.test(t.bg)) return;
  const parts=t.bg.split(',').map(p=>p.trim());
  const angle=parts[0];
  const stops=parts.slice(1).map(s=>{const [c,pos]=s.split(/\s+/);return {c,pos:(pos||'').replace(/\)/g,'')};});
  if(stops[idx]){ stops[idx].c = color; }
  const degM = angle.match(/linear-gradient\((\S+)/);
  const deg = degM ? degM[1] : '135deg';
  t.bg = `linear-gradient(${deg}, ` + stops.map(s=>s.pos?`${s.c} ${s.pos}`:s.c).join(', ') + `)`;
  syncTxt('bg'); refreshPanel();
}
// ฟอนต์ + มุมโค้ง
document.getElementById('fFont').addEventListener('change', e=>{ if(selected){ selected.t.font=e.target.value; refreshPanel(); } });
document.getElementById('rRadius').addEventListener('input', e=>{ if(selected){ selected.t.radius=e.target.value+'px'; document.getElementById('rRadiusVal').textContent=e.target.value; refreshPanel(); } });
// รีเซ็ต
document.getElementById('pReset').addEventListener('click', ()=>{
  if(!selected || !window.__origT) return;
  selected.t = JSON.parse(window.__origT);
  buildEditor(selected);
  const rv=parseInt(selected.t.radius)||12;
  document.getElementById('rRadius').value=Math.min(Math.max(rv,0),32);
  document.getElementById('rRadiusVal').textContent=rv;
  document.getElementById('fFont').value=selected.t.font;
  refreshPanel();
  toast('↺ รีเซ็ตเป็นค่าเดิมแล้ว');
});

/* ---------- export ---------- */
function cssText(s){
  const t=s.t;
  return `/* ============================================
   UI Style: ${s.name} (${s.tagTxt})
   สร้างจาก UI Style Picker — วางใน <style> หรือไฟล์ css ได้เลย
   ============================================ */
:root{
  --ui-name: "${s.name}";
  --ui-bg: ${t.bg};
  --ui-surface: ${t.surface};
  --ui-text: ${t.text};
  --ui-accent: ${t.accent};
  --ui-radius: ${t.radius};
  --ui-font: ${t.font};
  --ui-shadow: ${t.shadow};
  --ui-border: ${t.border};
  --ui-btn-bg: ${t.btn};
  --ui-btn-text: ${t.btnTxt};
  --ui-row-bg: ${t.row};
  --ui-row-text: ${t.rowTxt};
  --ui-nav: ${t.nav};
  --ui-icon-bg: ${t.icBg};
}

/* ตัวอย่างการใช้งาน */
.ui-card{
  background: var(--ui-surface);
  color: var(--ui-text);
  border: var(--ui-border);
  border-radius: var(--ui-radius);
  box-shadow: var(--ui-shadow);
  font-family: var(--ui-font);
}
.ui-btn{
  background: var(--ui-btn-bg);
  color: var(--ui-btn-text);
  border: none;
  border-radius: var(--ui-radius);
  padding: 10px 18px;
  font-family: var(--ui-font);
  cursor: pointer;
}
`;
}
function download(filename, text){
  const blob = new Blob([text],{type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
document.getElementById('pExportCss').addEventListener('click',()=>{
  if(!selected)return;
  download(`ui-style-${selected.id}.css`, cssText(selected));
  toast('⬇ ดาวน์โหลด ui-style-'+selected.id+'.css แล้ว!');
});
document.getElementById('pCopyCss').addEventListener('click',async()=>{
  if(!selected)return;
  try{
    await navigator.clipboard.writeText(cssText(selected));
    toast('📋 คัดลอก CSS แล้ว! ไปวางในโปรเจคได้เลย');
  }catch(e){
    download(`ui-style-${selected.id}.css`, cssText(selected));
    toast('⬇ บราวเซอร์ไม่ให้ copy — ดาวน์โหลดไฟล์แทนแล้ว');
  }
});
document.getElementById('btnExport').addEventListener('click',()=>{
  if(!selected)return;
  download(`ui-style-${selected.id}.css`, cssText(selected));
  toast('⬇ ดาวน์โหลด ui-style-'+selected.id+'.css แล้ว!');
});

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

render();
</script>
